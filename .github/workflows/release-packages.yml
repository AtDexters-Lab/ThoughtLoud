name: ThoughtLoud release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact reviewed v* tag to build and publish"
        required: true
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Linux x86_64 bundle and packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the requested tag
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          git checkout --detach "refs/tags/$RELEASE_TAG"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Install builder and desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.12-venv python3.12-dev build-essential cmake libvulkan-dev glslc libportaudio2 libxcb-cursor0 libegl1 libgl1 libxkbcommon-x11-0
          /usr/bin/python3.12 -m venv .venv-build
          .venv-build/bin/python -m pip install --require-hashes -r packaging/requirements-build.txt
          .venv-build/bin/python -m pip install pytest
      - name: Verify version and source tests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          .venv-build/bin/python -c 'import os,tomllib; assert tomllib.load(open("pyproject.toml","rb"))["project"]["version"] == os.environ["VERSION"]'
          .venv-build/bin/python -m pytest -q
      - name: Build pinned native helpers
        run: |
          git clone https://github.com/AtomicBot-ai/atomic-llama-cpp-turboquant.git build/llama-source
          git -C build/llama-source checkout --detach 0a635dcd92ba66c75fccfef91c3e106f4668f367
          runtime/linux/build.sh build/llama-source build/llama-linux
          git clone https://github.com/ReimuNotMoe/ydotool.git build/ydotool-source
          git -C build/ydotool-source checkout --detach 57ba7d0af525e82da2de0e275d169477f293b197
          packaging/build_ydotool.sh build/ydotool-source build/ydotool-package
      - name: Build complete application bundle
        run: |
          VOXD_LLAMA_RUNTIME="$PWD/build/llama-linux/bin" VOXD_YDOTOOL_RUNTIME="$PWD/build/ydotool-package" packaging/build_bundle.sh
      - name: Collect matching dependency sources
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist/packages
          .venv-build/bin/python packaging/collect_sources.py lock
          .venv-build/bin/python packaging/collect_sources.py fetch
          .venv-build/bin/python packaging/collect_sources.py package --output "dist/packages/thoughtloud-$VERSION-dependency-sources.tar"
      - name: Install pinned nFPM
        run: |
          mkdir -p build/tools
          curl -fL --retry 3 https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz -o build/tools/nfpm.tar.gz
          echo '0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  build/tools/nfpm.tar.gz' | sha256sum -c -
          tar -xzf build/tools/nfpm.tar.gz -C build/tools nfpm
      - name: Build install packages and matching app source
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARCH: amd64
        run: |
          mkdir -p dist/packages
          build/tools/nfpm pkg --packager deb -f packaging/nfpm.yaml --target dist/packages/
          build/tools/nfpm pkg --packager rpm -f packaging/nfpm.yaml --target dist/packages/
          # Preserve the reviewed commit, with only the manifest generated for
          # this builder substituted into its source snapshot.
          git diff --exit-code HEAD -- . ':!packaging/source-lock.json'
          source_dir="build/app-source/thoughtloud-$VERSION"
          mkdir -p "$source_dir"
          git archive HEAD | tar -x -C "$source_dir"
          cp packaging/source-lock.json "$source_dir/packaging/source-lock.json"
          SOURCE_DIR="$source_dir" .venv-build/bin/python -c 'import hashlib,json,os,pathlib,subprocess; p=pathlib.Path(os.environ["SOURCE_DIR"]); lock=p/"packaging/source-lock.json"; (p/"RELEASE_PROVENANCE.json").write_text(json.dumps({"commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"generated_files":{"packaging/source-lock.json":hashlib.sha256(lock.read_bytes()).hexdigest()},"note":"Application files match the reviewed commit; source-lock.json records the actual build providers."},indent=2)+"\n")'
          tar -czf "dist/packages/thoughtloud-$VERSION-source.tar.gz" -C build/app-source "thoughtloud-$VERSION"
          cd dist/packages
          sha256sum thoughtloud-* thoughtloud_* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/packages/*

  release:
    name: Publish reviewed release
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: dist/packages
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ThoughtLoud ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/packages/*
