name: thoughtloud
arch: ${ARCH}
version: ${VERSION}
release: "1"
section: utils
priority: optional
license: "MIT AND GPL-3.0-only AND LGPL-3.0-only AND AGPL-3.0-or-later"
maintainer: "AtDexters-Lab"
homepage: "https://github.com/AtDexters-Lab/voxd"
description: "ThoughtLoud - long, natural local dictation on Linux"
vendor: "ThoughtLoud"
replaces:
  - voxd
conflicts:
  - voxd

contents:
  - src: ./dist/thoughtloud/
    dst: /opt/voxd
    type: tree
  - src: packaging/thoughtloud.wrapper
    dst: /usr/bin/thoughtloud
    file_info:
      mode: 0755
  - src: packaging/thoughtloud.wrapper
    dst: /usr/bin/voxd
    file_info:
      mode: 0755
  - src: packaging/thoughtloud.desktop
    dst: /usr/share/applications/voxd-tray.desktop
  - src: src/voxd/assets/thoughtloud.svg
    dst: /usr/share/icons/hicolor/scalable/apps/thoughtloud.svg
  - src: packaging/99-uinput.rules
    dst: /etc/udev/rules.d/70-voxd-uinput.rules
    file_info:
      mode: 0644
  - src: packaging/ydotoold.service
    dst: /usr/lib/systemd/user/voxd-ydotoold.service
    file_info:
      mode: 0644
  - src: packaging/voxd-tray.service
    dst: /usr/lib/systemd/user/voxd-tray.service
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      - wl-clipboard
      - pulseaudio-utils
      - libportaudio2
      - libxcb-cursor0
      - libegl1
      - libgl1
      - libvulkan1
      - libssl3t64
      - libgomp1
      - libstdc++6
      - libc6 (>= 2.39)
    recommends:
      - pipewire-pulse | pulseaudio
  rpm:
    depends:
      - wl-clipboard
      - pulseaudio-utils
      - portaudio
      - xcb-util-cursor
      - libglvnd-egl
      - libglvnd-glx
      - vulkan-loader
      - openssl-libs
      - libgomp
      - libstdc++
      - glibc >= 2.39
    suggests:
      - pipewire-pulseaudio
  archlinux:
    depends:
      - wl-clipboard
      - libpulse
      - portaudio
      - xcb-util-cursor
      - libglvnd

scripts:
  postinstall: packaging/postinstall.sh
  postremove: packaging/postremove.sh

deb:
  compression: zstd
rpm:
  compression: zstd
