[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "thoughtloud"
version = "1.4.0"  # bump manually on releases
description = "Think out loud, in your own words. Local Linux dictation with Gemma."
authors = [{ name = "Jakov", email = "jakov.iv@proton.me" }]
requires-python = ">=3.9"
dependencies = [
  "sounddevice>=0.5",
  "pyqt6>=6.5",
  "platformdirs>=4.2",
  "pyyaml>=6.0",
  "pyperclip>=1.8",
  "numpy>=1.26",
  "requests>=2.28.0",
  "onnxruntime>=1.16.1",
  "dbus-next>=0.2.3; sys_platform == 'linux'"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["venv",".venv","build","dist"]

[project.scripts]
thoughtloud = "voxd.__main__:main"
voxd = "voxd.__main__:main"

[tool.hatch.build]
package-dir = "src"
include = [
  "THIRD_PARTY_NOTICES.md",
  "src/voxd/**/*.py",
  "src/voxd/assets/thoughtloud*.svg",
  "src/voxd/assets/thoughtloud*.png",
  "src/voxd/assets/*.onnx",
  "src/voxd/defaults/*.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voxd"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "voxd/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.editable]
packages = ["src/voxd"]
